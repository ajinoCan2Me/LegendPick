<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>レジェンドランダム抽出</title>

 
</head>

<body>

  <h1>ランダム抽出</h1>

  <p>
    カンマ区切りで候補を入力してください
  </p>

<!-- 定型文ボタン -->
<button onclick="insertText('バンガロール, ヒューズ, マッドマギー, バリスティック, レヴナント, パスファインダー, レイス, オクタン, ホライゾン, アッシュ, オルター, アクセル, ブラッドハウンド, クリプト, ヴァルキリー, シア, ヴァンテージ, コースティック, ワットソン, ランパート, カタリスト, ジブラルタル, ライフライン, ミラージュ, ローバ, ニューキャッスル, コンジット')">
全てのレジェンド
</button>

  <textarea
    id="input"
    placeholder="ろーば,まぎー,じぶ,おくたん,etc..."
  ></textarea>

  <div class="count-area">
    <label for="count">出力する数：</label>

    <select id="count">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>
  </div>

  <button onclick="randomPick()">
    ランダム抽出
  </button>

  <div id="results"></div>


  <script>
function insertText(text) {
    const box = document.getElementById("message");
    box.value += text;
}
    function randomPick() {

      const input =
        document.getElementById("input").value;

      const count =
        Number(document.getElementById("count").value);

      const results =
        document.getElementById("results");


      // カンマで分割
      const words = input
        .split(",")
        .map(word => word.trim())
        .filter(word => word !== "");


      // 入力チェック
      if (words.length === 0) {

        results.innerHTML =
          '<div class="result">候補を入力してください</div>';

        return;
      }


      // 候補数が出力数より少ない場合
      if (words.length < count) {

        results.innerHTML =
          `<div class="result">
            候補が${count}個以上必要です
          </div>`;

        return;
      }


      /*
       * 配列をシャッフル
       *
       * Fisher-Yatesアルゴリズム
       */
      const shuffled = [...words];

      for (let i = shuffled.length - 1; i > 0; i--) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
          [shuffled[j], shuffled[i]];
      }


      // 結果を表示
      results.innerHTML = "";

      for (let i = 0; i < count; i++) {

        const div =
          document.createElement("div");

        div.className = "result";

        div.textContent =
          shuffled[i];

        results.appendChild(div);
      }

    }

  </script>

</body>
</html>
