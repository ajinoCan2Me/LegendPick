<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ランダム抽出</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
    }

    .count-area {
      margin-top: 20px;
    }

    select {
      padding: 8px 30px 8px 10px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      padding: 10px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      color: white;
      background: #007bff;
    }

    button:hover {
      background: #0056b3;
    }

    #results {
      margin-top: 30px;
    }

    .result {
      margin: 10px 0;
      padding: 20px;
      background: white;
      border: 2px solid #007bff;
      border-radius: 10px;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>ランダム抽出</h1>

  <p>
    カンマ区切りで候補を入力してください
  </p>

  <textarea
    id="input"
    placeholder="りんご,みかん,バナナ,ぶどう,いちご"
  ></textarea>

  <div class="count-area">
    <label for="count">出力する数：</label>

    <select id="count">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>
  </div>

  <button onclick="randomPick()">
    ランダム抽出
  </button>

  <div id="results"></div>


  <script>

    function randomPick() {

      const input =
        document.getElementById("input").value;

      const count =
        Number(document.getElementById("count").value);

      const results =
        document.getElementById("results");


      // カンマで分割
      const words = input
        .split(",")
        .map(word => word.trim())
        .filter(word => word !== "");


      // 入力チェック
      if (words.length === 0) {

        results.innerHTML =
          '<div class="result">候補を入力してください</div>';

        return;
      }


      // 候補数が出力数より少ない場合
      if (words.length < count) {

        results.innerHTML =
          `<div class="result">
            候補が${count}個以上必要です
          </div>`;

        return;
      }


      /*
       * 配列をシャッフル
       *
       * Fisher-Yatesアルゴリズム
       */
      const shuffled = [...words];

      for (let i = shuffled.length - 1; i > 0; i--) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
          [shuffled[j], shuffled[i]];
      }


      // 結果を表示
      results.innerHTML = "";

      for (let i = 0; i < count; i++) {

        const div =
          document.createElement("div");

        div.className = "result";

        div.textContent =
          shuffled[i];

        results.appendChild(div);
      }

    }

  </script>

</body>
</html>
