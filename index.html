<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダム抽出</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 30px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      font-size: 32px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>ランダム抽出</h1>

  <p>カンマ区切りで単語を入力してください。</p>

  <textarea id="input" placeholder="りんご,みかん,バナナ,ぶどう"></textarea>

  <br>

  <button onclick="randomPick()">抽出する</button>

  <div id="result"></div>

  <script>
    function randomPick() {
      const input = document.getElementById("input").value;

      // カンマで分割して、前後の空白を削除
      const words = input
        .split(",")
        .map(word => word.trim())
        .filter(word => word !== "");

      // 入力チェック
      if (words.length === 0) {
        document.getElementById("result").textContent =
          "単語を入力してください";
        return;
      }

      // ランダムに1つ選択
      const randomIndex = Math.floor(Math.random() * words.length);
      const selected = words[randomIndex];

      // 結果を表示
      document.getElementById("result").textContent = selected;
    }
  </script>

</body>
</html>
