<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ランダム抽出</title>
</head>

<body>

  <h2>ランダム抽出</h2>

  <!-- CSV入力 -->
  <p>候補をカンマ区切りで入力：</p>
  <input
    type="text"
    id="csv"
    placeholder="バンテージ,ライフラ,マギー"
    style="width:300px;"
  >

  <!-- 個数 -->
  <p>選ぶ個数：</p>
  <input
    type="number"
    id="count"
    value="1"
    min="1"
  >

  <br><br>

  <button onclick="randomSelect()">ランダム抽出</button>

  <!-- 結果 -->
  <p>結果：</p>
  <input
    type="text"
    id="result"
    readonly
    style="width:300px;"
  >

  <script>
    function randomSelect() {

      // カンマで分割
      let items = document.getElementById("csv").value
        .split(",")
        .map(item => item.trim())
        .filter(item => item !== "");

      let count = Number(document.getElementById("count").value);

      // 候補がない場合
      if (items.length === 0) {
        document.getElementById("result").value = "";
        return;
      }

      // 個数が多すぎる場合
      count = Math.min(count, items.length);

      // ランダムに並び替え
      items.sort(() => Math.random() - 0.5);

      // 指定個数を取得
      let result = items.slice(0, count);

      // 結果表示
      document.getElementById("result").value = result.join(",");
    }
  </script>

</body>
</html>
