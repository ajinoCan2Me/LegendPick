<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ランダム抽出</title>
</head>
<body>

  <h2>ランダム抽出</h2>

  <p>CSVを入力：</p>
  <input type="text" id="csv" value="バンテージ、ライフラ、マギー">

  <p>選ぶ数：</p>
  <input type="number" id="count" value="1" min="1">

  <button onclick="randomSelect()">ランダム</button>

  <p>結果：</p>
  <input type="text" id="result" readonly>

  <script>
    function randomSelect() {
      // CSVを「、」で分割
      let items = document.getElementById("csv").value.split("、");

      // 空白を削除
      items = items.map(item => item.trim()).filter(item => item !== "");

      // 選ぶ数
      let count = Number(document.getElementById("count").value);

      // 数が多すぎる場合
      if (count > items.length) {
        count = items.length;
      }

      // ランダムに並び替え
      items.sort(() => Math.random() - 0.5);

      // 指定数だけ取得
      let result = items.slice(0, count);

      // 表示
      document.getElementById("result").value = result.join("、");
    }
  </script>

</body>
</html>
